services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tank_online
      POSTGRES_USER: tank
      POSTGRES_PASSWORD: tank
    ports:
      - "5432:5432"
    volumes:
      - tank_online_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tank -d tank_online"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tank_online_postgres:

